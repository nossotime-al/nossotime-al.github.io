name: Build e Deploy Blindado Nosso Time

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-nosso-time"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Validar TypeScript e Compilar
        run: npm run build

      - name: Guardião Anti-Placeholder e Integridade
        run: |
          test -f dist/index.html
          if grep -q "PLACEHOLDER_WILL_REPLACE" dist/index.html; then
            echo "ERRO CRÍTICO: Placeholder detectado no build. Deploy bloqueado!"
            exit 1
          fi
          if ! grep -q "Nosso Time" dist/index.html; then
            echo "ERRO CRÍTICO: Título Nosso Time ausente. Deploy bloqueado!"
            exit 1
          fi

      - name: Enviar artefato validado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
